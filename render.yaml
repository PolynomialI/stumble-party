# Render Blueprint (https://render.com/docs/blueprint-spec): the game server plus the browser client.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository. Step-by-step guide in README.md.
services:
  # Authoritative game server: Colyseus rooms over WebSockets, Rapier physics at 30 Hz.
  - type: web
    name: stumble-party-server
    runtime: node
    # Free instances sleep after 15 idle minutes and take about a minute to wake (README explains).
    # For regular play or several matches at once, use a paid instance type such as 0.5c-512mb.
    plan: free
    # Put the server near your players: oregon, ohio, virginia, frankfurt or singapore.
    region: oregon
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /health

  # Browser client: built once, then served from Render's CDN (static sites never sleep).
  - type: web
    name: stumble-party
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      # The server's public https://....onrender.com address, baked into the client at build time.
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: stumble-party-server
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      # Everything under /assets has a content hash in its file name, so browsers may keep it for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
